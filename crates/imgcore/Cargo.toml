[package]
name = "imgcore"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
fast_image_resize = "6.1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
mozjpeg = "0.10.13"
qcms = "0.3.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
trash = { version = "5.2.9", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["trash"]
trash = ["dep:trash"]
